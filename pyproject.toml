[project]
name = "sms-spam-detection-api"
version = "1.0.0"
description = "A small FastAPI service for SMS spam classification."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.128,<1",
    "nltk>=3.9,<4",
    "scikit-learn==1.8.0",
    "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
